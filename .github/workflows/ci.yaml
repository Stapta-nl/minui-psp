---
name: "ci"

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

permissions:
  attestations: write
  id-token: write
  contents: write
  checks: write

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Create release
        run: make clean build release

      - name: Get Pak Name
        id: pak-name
        run: |
          echo "PAK_NAME=$(jq -r .name pak.json)" >> $GITHUB_OUTPUT

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: "${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"
          path: "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"

      - name: Build device test bundle
        run: make test-bundle

      - name: Upload device test bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: psp-device-tests
          path: dist/psp-device-tests.tar.gz

      - name: Unpack release
        run: |
          rm -rf "$RUNNER_TEMP/rel" && mkdir -p "$RUNNER_TEMP/rel"
          unzip -q "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip" -d "$RUNNER_TEMP/rel"

      # shellcheck, the release contents check, the devices.env.example check and the
      # stub-PPSSPP tests (Game Switcher preview, RetroAchievements sync). The bats tests
      # run the real launch.sh and the shipped aarch64 jpg2bmp (this runner is arm64)
      # from the unpacked release, not the repository checkout. Never uses ssh.
      # Writes dist/test-out/host (JUnit, summary.md) and dist/test-report-host-*.tar.gz.
      - name: Test
        timeout-minutes: 10
        run: make test SRC_PAK="$RUNNER_TEMP/rel" RELEASE_ZIP="dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"

      # Per-test results as a check run on the PR. Forks get a read-only token and cannot
      # create check runs: the job summary and the artifact below are their fallback.
      - name: Test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v2.0.0
        with:
          name: Tests
          path: dist/test-out/host/junit/report.xml
          reporter: java-junit
          fail-on-error: false

      - name: Test summary
        if: always()
        run: |
          if [ -f dist/test-out/host/summary.md ]; then
            cat dist/test-out/host/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test debug bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-report-host
          path: dist/test-report-host-*.tar.gz
          if-no-files-found: warn

      # The RetroAchievements cases also run under dash in `make test`; here every tool
      # is a BusyBox applet like on the device.
      - name: Test RetroAchievements sync (BusyBox)
        timeout-minutes: 5
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -e SRC_PAK="$RUNNER_TEMP/rel" -e OUT_DIR="$RUNNER_TEMP/test-out/ra-busybox" \
            busybox:1.36.1 sh /repo/tests/ra.sh

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ra-busybox-test-logs
          path: ${{ runner.temp }}/test-out

  test-release:
    name: test-release
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Get Pak Name
        id: pak-name
        run: |
          echo "PAK_NAME=$(jq -r .name pak.json)" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: "${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"
          path: "dist"

      - name: Validate Artifact exists
        run: |
          if [ ! -f "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip" ]; then
            echo "Artifact does not exist"
            exit 1
          fi
