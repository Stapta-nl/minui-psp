---
name: "ci"

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

permissions:
  attestations: write
  id-token: write
  contents: write
  checks: write

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Create release
        run: make clean build release

      - name: Get Pak Name
        id: pak-name
        run: |
          echo "PAK_NAME=$(jq -r .name pak.json)" >> $GITHUB_OUTPUT

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: "${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"
          path: "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"

      - name: Build device test bundle
        run: make test-bundle

      - name: Upload device test bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: psp-device-tests
          path: dist/psp-device-tests.tar.gz

      - name: Unpack release
        run: |
          rm -rf "$RUNNER_TEMP/rel" && mkdir -p "$RUNNER_TEMP/rel"
          unzip -q "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip" -d "$RUNNER_TEMP/rel"

      # shellcheck, the release contents check, the devices.env.example check and the
      # stub-PPSSPP tests (Game Switcher preview, RetroAchievements sync). The bats tests
      # run the real launch.sh and the shipped aarch64 jpg2bmp (this runner is arm64)
      # from the unpacked release, not the repository checkout. Never uses ssh.
      # Writes dist/test-out/host (JUnit, summary.md) and dist/test-report-host-*.tar.gz.
      - name: Test
        timeout-minutes: 10
        run: make test SRC_PAK="$RUNNER_TEMP/rel" RELEASE_ZIP="dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"

      # Per-test results as a check run on the PR. Forks get a read-only token and cannot
      # create check runs: the job summary and the artifact below are their fallback.
      - name: Test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v2.0.0
        with:
          name: Tests
          path: dist/test-out/host/junit/report.xml
          reporter: java-junit
          fail-on-error: false

      - name: Test summary
        if: always()
        run: |
          if [ -f dist/test-out/host/summary.md ]; then
            cat dist/test-out/host/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test debug bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-report-host
          path: dist/test-report-host-*.tar.gz
          if-no-files-found: warn

      # launch.sh again, this time run by BusyBox sh (the shell on the devices) instead of dash.
      # The tests themselves are bash; only launch.sh runs under LAUNCH_SHELL. Results and
      # bundle get their own names so they do not collide with the run above.
      # The first bundle is removed so the second upload holds only its own.
      - name: Install BusyBox
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static
          rm -f dist/test-report-host-*.tar.gz

      - name: Test (BusyBox sh)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: make test SRC_PAK="$RUNNER_TEMP/rel" RELEASE_ZIP="dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip" LAUNCH_SHELL="busybox sh"

      - name: Test report (BusyBox sh)
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v2.0.0
        with:
          name: Tests (BusyBox sh)
          path: dist/test-out/host/junit/report.xml
          reporter: java-junit
          fail-on-error: false

      - name: Test summary (BusyBox sh)
        if: always()
        run: |
          if [ -f dist/test-out/host/summary.md ]; then
            { echo "### launch.sh run by BusyBox sh"; cat dist/test-out/host/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test debug bundle (BusyBox sh)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-report-host-busybox
          path: dist/test-report-host-*.tar.gz
          if-no-files-found: warn

  test-release:
    name: test-release
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Get Pak Name
        id: pak-name
        run: |
          echo "PAK_NAME=$(jq -r .name pak.json)" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: "${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"
          path: "dist"

      - name: Validate Artifact exists
        run: |
          if [ ! -f "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip" ]; then
            echo "Artifact does not exist"
            exit 1
          fi
